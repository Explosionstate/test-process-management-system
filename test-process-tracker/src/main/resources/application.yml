server:
  port: 8080

spring:
  application:
    name: test-process-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/test_process_tracker?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

app:
  session-cookie: TPT_SESSION
